<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; background: #14130F; }
    button { font-family: inherit; cursor: pointer; }
    a { color: #E08A5F; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14130F; color: #EDE7D8; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 6px; height: 52px; flex-shrink: 0;">
    <a href="Phone-Draft.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A39B89; font-size: 20px; text-decoration: none;">&larr;</a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #A39B89;">3 &middot; DEPLOY</span>
    <button type="button" style="min-width: 44px; height: 44px; background: none; border: none; color: #EDE7D8; font-size: 13px; padding: 0 8px;">Roster</button>
  </header>

  <div style="display: flex; gap: 4px; padding: 0 18px 10px 18px; flex-shrink: 0;">
    <sc-for list="{{progress}}" as="p" hint-placeholder-count="4">
      <div style="flex-grow: 1; height: 3px; background: {{p.color}}; border-radius: 1px;"></div>
    </sc-for>
  </div>

  <div style="padding: 0 18px 8px 18px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between;">
    <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; line-height: 1.05;">Set the line</span>
    <button type="button" onClick="{{autoDeploy}}" style="background: none; border: 1px solid #454036; color: #A39B89; font-size: 12px; padding: 9px 12px; border-radius: 3px; min-height: 44px;">Standard order</button>
  </div>

  <div style="padding: 0 18px 10px 18px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; gap: 5px;">
      <sc-for list="{{plans}}" as="p" hint-placeholder-count="4">
        <button type="button" onClick="{{p.pick}}" style="flex-grow: 1; flex-basis: 0; background: {{p.bg}}; border: 1px solid {{p.edge}}; color: {{p.text}}; font-size: 11px; padding: 0 4px; border-radius: 3px; min-height: 40px;">{{p.name}}</button>
      </sc-for>
    </div>
    <span style="font-size: 11px; color: {{planNoteColor}}; line-height: 1.4;">{{planNote}}</span>
  </div>

  <div style="margin: 0 18px 10px 18px; flex-shrink: 0; background: #191712; border: 1px dashed #322E27; border-radius: 3px; padding: 8px 10px; display: flex; align-items: center; gap: 10px;">
    <div style="display: flex; gap: 4px; flex-shrink: 0;">
      <sc-for list="{{enemyFronts}}" as="e" hint-placeholder-count="3">
        <div style="width: {{e.w}}; height: 26px; border: 1px solid #2E2A23; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #4E4A3F;">?</div>
      </sc-for>
    </div>
    <span style="font-size: 11px; color: #A39B89; line-height: 1.35;">He brings six that stand and two that ride. Pack the centre and his wings are one unit each.</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 18px; min-height: 0; overflow: hidden;">
    <sc-for list="{{fronts}}" as="f" hint-placeholder-count="3">
      <div style="flex-grow: {{f.grow}}; flex-basis: 0; min-height: 0; background: {{f.bg}}; border: 1px solid {{f.edge}}; border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px;">

        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <div style="display: flex; align-items: baseline; gap: 9px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #EDE7D8;">{{f.label}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #5C5749;">{{f.faces}}</span>
          </div>
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{f.cohColor}};">{{f.cohWord}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6F6858;">{{f.cohNum}}</span>
          </div>
        </div>

        <div style="display: flex; gap: 5px; flex-wrap: wrap; flex-grow: 1; align-content: flex-start;">
          <sc-for list="{{f.units}}" as="u" hint-placeholder-count="2">
            <button type="button" onClick="{{u.lift}}" style="display: flex; align-items: center; gap: 6px; background: {{u.bg}}; border: 1px solid {{u.edge}}; border-radius: 2px; padding: 7px 8px; min-height: 36px; box-sizing: border-box;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: {{u.gradeColor}};">{{u.grade}}</span>
              <span style="font-size: 12px; color: #EDE7D8;">{{u.name}}</span>
              <span style="width: 6px; height: 6px; border-radius: 50%; background: {{u.classColor}};"></span>
            </button>
          </sc-for>
          <sc-if value="{{f.empty}}" hint-placeholder-val="{{true}}">
            <span style="font-size: 11px; color: #D9724F; line-height: 1.4; padding: 6px 2px;">{{f.emptyNote}}</span>
          </sc-if>
          <sc-if value="{{f.canPlace}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{f.place}}" style="width: 100%; background: #2A2419; border: 1px dashed {{accent}}; color: #EDE7D8; font-size: 13px; font-weight: 500; padding: 10px; border-radius: 2px; min-height: 44px;">{{f.placeLabel}}</button>
          </sc-if>
        </div>

      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; padding: 10px 18px 0 18px;">
    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #6F6858; width: 100%;">NOT YET PLACED</span>
      <sc-for list="{{tray}}" as="u" hint-placeholder-count="3">
        <button type="button" onClick="{{u.lift}}" style="display: flex; align-items: center; gap: 6px; background: {{u.bg}}; border: 1px solid {{u.edge}}; border-radius: 2px; padding: 8px 9px; min-height: 40px; box-sizing: border-box;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: {{u.gradeColor}};">{{u.grade}}</span>
          <span style="font-size: 12px; color: #EDE7D8;">{{u.name}}</span>
          <span style="width: 6px; height: 6px; border-radius: 50%; background: {{u.classColor}};"></span>
        </button>
      </sc-for>
      <sc-if value="{{trayEmpty}}" hint-placeholder-val="{{true}}">
        <span style="font-size: 12px; color: #6F6858;">All eight are on the line.</span>
      </sc-if>
      <sc-if value="{{canUnplace}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{unplace}}" style="background: none; border: 1px dashed #454036; color: #A39B89; font-size: 12px; padding: 8px 12px; border-radius: 2px; min-height: 40px;">Take off the line</button>
      </sc-if>
    </div>
  </div>

  <div style="flex-shrink: 0; border-top: 1px solid #2E2A23; background: #1A1813; margin-top: 12px; padding: 11px 18px 28px 18px; display: flex; flex-direction: column; gap: 9px;">
    <div style="font-size: 12px; color: {{hintColor}}; line-height: 1.4; min-height: 17px;">{{hint}}</div>
    <a href="Phone-Battle.dc.html" style="display: block; text-align: center; text-decoration: none; background: {{ctaBg}}; border: 1px solid {{ctaEdge}}; color: {{ctaText}}; font-size: 16px; font-weight: 600; padding: 15px; border-radius: 3px; min-height: 44px; box-sizing: border-box;">{{ctaLabel}}</a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#C4562E","options":["#C4562E","#C9A227","#7D8C5C","#8A6FA8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  roster() {
    return [
      { name: 'Triarii', klass: 'line', grade: 'B', dis: 90, home: 'C' },
      { name: 'Wei Wuzu', klass: 'line', grade: 'S', dis: 85, home: 'C' },
      { name: 'Kshatriya Swords', klass: 'shock', grade: 'B', dis: 65, home: 'C' },
      { name: 'Kshatriya Swords', klass: 'shock', grade: 'B', dis: 65, home: 'C' },
      { name: 'Persian Heavy Cav', klass: 'cavalry', grade: 'B', dis: 63, home: 'L' },
      { name: 'Kshatriya Noble Cav', klass: 'cavalry', grade: 'B', dis: 57.75, home: 'R' },
      { name: 'Indian Longbows', klass: 'ranged', grade: 'B', dis: 55, home: 'L' },
      { name: 'Indian Longbows', klass: 'ranged', grade: 'B', dis: 55, home: 'R' }
    ];
  }

  plans() {
    return {
      Aggressive: { morale: 0.95, note: 'Contact x1.15, steadiness x0.90. Off Ashoka’s style.' },
      Defensive: { morale: 1.05, note: 'Steadiness x1.10, centre x1.05. Matches Ashoka: +8% everywhere.' },
      Envelopment: { morale: 1.0, note: 'Wings x1.25, centre x0.90. Off Ashoka’s style.' },
      Skirmish: { morale: 1.0, note: 'Skirmish x1.30, wings x1.10. Off Ashoka’s style.' }
    };
  }

  renderVals() {
    const accent = this.props.accent ?? '#C4562E';
    const st = this.state || {};
    const roster = this.roster();
    const placed = st.placed || [null, null, null, null, 'L', 'R', 'L', 'R'];
    const held = st.held === undefined ? null : st.held;
    const plan = st.plan || 'Defensive';
    const P = this.plans()[plan];
    const wingish = { cavalry: true, skirmish: true, special: true };
    const CHARISMA = 75;

    const gradeColor = (g) => (g === 'S' ? '#C9A227' : g === 'A' ? '#D8CBAE' : g === 'B' ? '#9C9686' : '#8A8271');

    const put = (target) => {
      if (held === null) return;
      const next = placed.slice();
      next[held] = target;
      this.setState({ placed: next, held: null });
    };

    const chip = (u, i) => ({
      name: u.name,
      grade: u.grade,
      gradeColor: gradeColor(u.grade),
      classColor: wingish[u.klass] ? '#8FA9C4' : '#C4BDAC',
      bg: held === i ? '#2A2419' : '#211E18',
      edge: held === i ? accent : '#3A362E',
      lift: () => this.setState({ held: held === i ? null : i })
    });

    const defs = [
      { id: 'L', label: 'LEFT', faces: 'FACES HIS RIGHT', grow: 1, emptyNote: 'Empty. It gives way at contact: 0.25 of the army, and his right rolls into your centre.' },
      { id: 'C', label: 'CENTRE', faces: 'FACES HIS CENTRE', grow: 1.25, emptyNote: 'Empty. Ashoka would be standing alone: 0.40 on the spot.' },
      { id: 'R', label: 'RIGHT', faces: 'FACES HIS LEFT', grow: 1, emptyNote: 'Empty. It gives way at contact: 0.25 of the army, and his left rolls into your centre.' }
    ];

    const word = (c) => (c >= 1.0 ? 'FIRM' : (c >= 0.92 ? 'STEADY' : 'BRITTLE'));
    const wordColor = (c) => (c >= 1.0 ? '#C9A227' : (c >= 0.92 ? '#C4BDAC' : '#D9724F'));

    const fronts = defs.map((d) => {
      const idx = roster.map((u, i) => i).filter((i) => placed[i] === d.id);
      const n = idx.length;
      const avgDis = n ? idx.reduce((t, i) => t + roster[i].dis, 0) / n : 0;
      const coh = n ? (0.55 + (avgDis / 100) * 0.35 + (CHARISMA / 100) * 0.2) * P.morale : 0;
      const holdingElsewhere = held !== null && placed[held] !== d.id;
      return {
        label: d.label,
        faces: d.faces,
        grow: String(d.grow),
        units: idx.map((i) => chip(roster[i], i)),
        empty: n === 0 && !holdingElsewhere,
        emptyNote: d.emptyNote,
        canPlace: holdingElsewhere,
        placeLabel: 'Place on the ' + d.label.toLowerCase(),
        cohWord: n ? word(coh) : 'NOTHING HERE',
        cohNum: n ? coh.toFixed(2) : '',
        cohColor: n === 0 ? '#D9724F' : wordColor(coh),
        bg: holdingElsewhere ? '#1E1B15' : '#1C1A15',
        edge: holdingElsewhere ? '#6B5636' : (n === 0 ? '#4A3228' : '#35312A'),
        place: () => put(d.id)
      };
    });

    const trayIdx = roster.map((u, i) => i).filter((i) => !placed[i]);
    const allPlaced = trayIdx.length === 0;

    const plans = Object.keys(this.plans()).map((name) => ({
      name: name,
      bg: name === plan ? '#2A2419' : 'transparent',
      edge: name === plan ? accent : '#3D382F',
      text: name === plan ? '#EDE7D8' : '#A39B89',
      pick: () => this.setState({ plan: name })
    }));

    return {
      accent: accent,
      progress: [{ color: '#C9A227' }, { color: '#C9A227' }, { color: accent }, { color: '#2E2A23' }],
      plans: plans,
      planNote: P.note,
      planNoteColor: plan === 'Defensive' ? '#C9A227' : '#8A8271',
      enemyFronts: [{ w: '26px' }, { w: '40px' }, { w: '26px' }],
      fronts: fronts,
      tray: trayIdx.map((i) => chip(roster[i], i)),
      trayEmpty: allPlaced && held === null,
      canUnplace: held !== null && placed[held] !== null,
      unplace: () => put(null),
      autoDeploy: () => this.setState({ placed: this.roster().map((u) => u.home), held: null }),
      hint: held === null
        ? (allPlaced ? 'Tap any unit to move it.' : 'Tap a unit, then tap where it stands.')
        : 'Holding ' + roster[held].name + '. Tap a front.',
      hintColor: held === null ? '#6F6858' : '#C9A227',
      ctaLabel: allPlaced ? 'Give battle' : trayIdx.length + ' still unplaced',
      ctaBg: allPlaced ? '#A8401F' : '#26221A',
      ctaEdge: allPlaced ? '#A8401F' : '#454036',
      ctaText: allPlaced ? '#F5EFE3' : '#8A8271'
    };
  }
}
</script>
</body>
</html>
