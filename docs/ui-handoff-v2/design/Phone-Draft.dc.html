<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; background: #100F0C; }
    button { font-family: inherit; cursor: pointer; }
    a { color: #E08A5F; }
    @keyframes wdreel { from { transform: translateY(0); } to { transform: translateY(-50%); } }
    @keyframes wdstop { 0% { transform: translateY(0); } 78% { transform: translateY(-190px); } 100% { transform: translateY(-180px); } }
    @keyframes wdland {
      0% { transform: translateY(-10px); opacity: 0.2; }
      55% { transform: translateY(2px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #100F0C; color: #F2ECDD; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 6px; height: 52px; flex-shrink: 0;">
    <a href="Phone-General.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #B3AC9C; font-size: 20px; text-decoration: none;">←</a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #B3AC9C;">ROW 6 OF 8</span>
    <div style="display: flex; align-items: center;">
      <a href="Phone-Glossary.dc.html" aria-label="What do the numbers mean?" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none;"><span style="width: 22px; height: 22px; border-radius: 50%; border: 1px solid #4A453C; color: #B3AC9C; font-family: 'IBM Plex Mono', monospace; font-size: 12px; display: flex; align-items: center; justify-content: center;">?</span></a>
      <a href="Phone-Board.dc.html" style="min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2ECDD; font-size: 13px; text-decoration: none; padding: 0 8px 0 4px;">Board</a>
    </div>
  </header>

  <div style="display: flex; gap: 3px; padding: 0 18px 12px 18px; flex-shrink: 0;">
    <sc-for list="{{progress}}" as="p" hint-placeholder-count="8">
      <div style="flex-grow: 1; height: 3px; background: {{p.color}}; border-radius: 1px;"></div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 18px 12px 18px; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; color: {{accent}};">RANGED</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; line-height: 1.05; color: #F2A23C;">India</span>
      <span style="font-size: 11px; color: #6F6858; line-height: 1.4;">A ranged row: read SHOOT first, then SPEED if it goes on a wing.</span>
    </div>
    <button type="button" onClick="{{reroll}}" style="flex-shrink: 0; background: none; border: 1px solid {{rerollEdge}}; color: {{rerollColor}}; font-size: 12px; padding: 11px 13px; border-radius: 3px; min-height: 44px;">{{rerollLabel}}</button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 9px; padding: 0 18px; min-height: 0; overflow: hidden;">
    <sc-for list="{{cards}}" as="card" hint-placeholder-count="4">
      <div style="flex-grow: 1; flex-basis: 0; min-height: 0; position: relative;">

        <sc-if value="{{card.spinning}}" hint-placeholder-val="{{true}}">
          <div style="position: absolute; inset: 0; background: #16140F; border: 1px solid #2C2822; border-radius: 4px; overflow: hidden;">
            <div style="position: absolute; left: 0; right: 0; top: 50%; height: 34px; margin-top: -17px; background: rgba(255, 255, 255, 0.04); border-top: 1px solid {{card.line}}; border-bottom: 1px solid {{card.line}};"></div>
            <sc-if value="{{card.looping}}" hint-placeholder-val="{{true}}">
              <div style="position: absolute; left: 0; right: 0; top: 50%; margin-top: -15px; animation: wdreel {{card.reelSpeed}} linear infinite; animation-delay: {{card.reelDelay}};">
                <sc-for list="{{card.reel}}" as="n" hint-placeholder-count="16">
                <div style="height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box;">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{n.gc}}; width: 12px;">{{n.grade}}</span>
                  <span style="font-size: 14px; color: {{n.nc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{n.name}}</span>
                </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{card.braking}}" hint-placeholder-val="{{true}}">
              <div style="position: absolute; left: 0; right: 0; top: 50%; margin-top: -15px; animation: wdstop 480ms cubic-bezier(0.1, 0.8, 0.2, 1) 1 forwards;">
                <sc-for list="{{card.stopStrip}}" as="n" hint-placeholder-count="10">
                <div style="height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box;">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{n.gc}}; width: 12px;">{{n.grade}}</span>
                  <span style="font-size: 14px; color: {{n.nc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{n.name}}</span>
                </div>
                </sc-for>
              </div>
            </sc-if>
            <div style="position: absolute; inset: 0; background: linear-gradient(#16140F 0%, rgba(0, 0, 0, 0) 28%, rgba(0, 0, 0, 0) 72%, #16140F 100%); pointer-events: none;"></div>
          </div>
        </sc-if>

        <sc-if value="{{card.settled}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{card.pick}}" style="position: absolute; inset: 0; text-align: left; background: {{card.bg}}; border: 1px solid {{card.edge}}; border-left: 3px solid #F2A23C; border-radius: 4px; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; justify-content: space-between; opacity: {{card.opacity}}; animation: wdland 240ms ease-out 1;">

            <div style="display: flex; align-items: flex-start; gap: 9px;">
              <span style="flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; background: {{card.gradeBg}}; color: {{card.gradeText}}; border: 1px solid {{card.gradeEdge}}; border-radius: 2px; padding: 2px 7px;">{{card.grade}}</span>
              <span style="flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 500; color: #F2ECDD; line-height: 1.2;">{{card.name}}</span>
              <span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: 1px solid {{card.dotEdge}}; background: {{card.dotBg}}; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #100F0C;">{{card.dot}}</span>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: {{card.classColor}}; border: 1px solid {{card.classEdge}}; border-radius: 2px; padding: 2px 6px;">{{card.klass}}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9A9384; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{card.meta}}</span>
            </div>

            <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px;">
              <sc-for list="{{card.stats}}" as="s" hint-placeholder-count="6">
                <div style="display: flex; flex-direction: column; gap: 1px;">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 0.06em; color: #9A9384;">{{s.k}}</span>
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: {{s.color}};">{{s.v}}</span>
                </div>
              </sc-for>
            </div>

            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: {{card.whyColor}};">{{card.why}}</div>

          </button>
        </sc-if>

      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; border-top: 1px solid #2C2822; background: #16140F; padding: 12px 18px 28px 18px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; gap: 7px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <div style="flex-grow: 1; flex-basis: 0; background: #2C2822; border: 1px solid {{c.edge}}; border-radius: 3px; padding: 7px 8px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.08em; color: #6F6858;">{{c.k}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{c.color}};">{{c.v}}</span>
        </div>
      </sc-for>
    </div>
    <a href="Phone-Deploy.dc.html" style="display: block; text-align: center; text-decoration: none; background: {{ctaBg}}; border: 1px solid {{ctaEdge}}; color: {{ctaText}}; font-size: 16px; font-weight: 600; padding: 15px; border-radius: 3px; min-height: 44px; box-sizing: border-box;">{{ctaLabel}}</a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D9633C","options":["#C4562E","#F2ECDD","#7D8C5C","#8A6FA8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  componentDidMount() {
    this.timers = [];
    this.roll();
  }

  componentWillUnmount() {
    (this.timers || []).forEach((t) => clearTimeout(t));
  }

  cards() {
    // Row 6 of draft seed 1147: a ranged row, dealt out of India. Ashoka plus two Indians are already in.
    return [
      ['Hill Tribe Archers', 'ranged', 'archer', 5, 'C', [30, 70, 20, 65, 55, 10]],
      ['Mauryan Infantry', 'line', 'spear', 6, 'C', [65, 0, 55, 40, 70, 40]],
      ['Javelin Skirmishers', 'skirmish', 'javelin', 6, 'C', [45, 60, 20, 80, 50, 25]],
      ['Indian Longbowmen', 'ranged', 'archer', 9, 'B', [35, 85, 20, 50, 55, 10]]
    ];
  }

  setPhase(i, p) {
    this.setState((st) => {
      const ph = ((st && st.phase) || [2, 2, 2, 2]).slice();
      ph[i] = p;
      return { phase: ph };
    });
  }

  roll() {
    // Slot cadence: every reel spins, then they brake and stop one at a time, top to bottom.
    (this.timers || []).forEach((t) => clearTimeout(t));
    this.timers = [];
    const n = this.cards().length;
    this.setState({ phase: [0, 0, 0, 0].slice(0, n), picked: null });
    for (let i = 0; i < n; i++) {
      const settleAt = 520 + i * 300 + (i === n - 1 ? 80 : 0);
      this.timers.push(setTimeout(() => this.setPhase(i, 1), settleAt - 480));
      this.timers.push(setTimeout(() => this.setPhase(i, 2), settleAt));
    }
  }

  gradeStyle(g) {
    if (g === 'S') return { gradeBg: '#F2ECDD', gradeText: '#100F0C', gradeEdge: '#FFFFFF' };
    if (g === 'A') return { gradeBg: '#BDB5A4', gradeText: '#100F0C', gradeEdge: '#BDB5A4' };
    if (g === 'B') return { gradeBg: '#7E786B', gradeText: '#100F0C', gradeEdge: '#7E786B' };
    return { gradeBg: 'transparent', gradeText: '#B8B1A0', gradeEdge: '#5F5949' };
  }

  renderVals() {
    const accent = this.props.accent ?? '#D9633C';
    const st = this.state || {};
    const phase = st.phase || [2, 2, 2, 2];
    const rolling = phase.some((p) => p < 2);
    const picked = st.picked === undefined ? null : st.picked;
    const rerolls = st.rerolls === undefined ? 2 : st.rerolls;
    const data = this.cards();
    const keys = ['FIGHT', 'SHOOT', 'ARMOUR', 'SPEED', 'STEADY', 'CHARGE'];
    const wingish = { cavalry: true, skirmish: true, special: true };

    const pool = data.map((c) => ({ grade: c[4], name: c[0], gc: '#5C5749', nc: '#6F6858' })).concat([
      { grade: 'C', name: 'Sword-and-Buckler Infantry', gc: '#5C5749', nc: '#6F6858' },
      { grade: 'B', name: 'Kshatriya Noble Cavalry', gc: '#5C5749', nc: '#6F6858' },
      { grade: 'D', name: 'Levy Spearmen', gc: '#5C5749', nc: '#6F6858' },
      { grade: 'C', name: 'Javelin Skirmishers', gc: '#5C5749', nc: '#6F6858' }
    ]);
    const strip = pool.concat(pool);

    const cards = data.map((c, i) => {
      const isSpinning = phase[i] < 2;
      const sel = picked === i;
      const dimmed = picked !== null && !sel;
      const wing = !!wingish[c[1]];
      return Object.assign({
        name: c[0],
        klass: c[1].toUpperCase(),
        classColor: wing ? '#8FA9C4' : '#C4BDAC',
        classEdge: wing ? '#3F5062' : '#4A4538',
        meta: c[2] + ' · ' + (wing ? 'WINS A WING' : 'HOLDS A CENTRE'),
        why: sel ? 'INDIA 4 · ELEPHANT LINE IS ON' : 'INDIA 4 → ELEPHANT LINE ON',
        whyColor: '#F2A23C',
        grade: c[4],
        stats: keys.map((k, j) => ({ k: k, v: c[5][j], color: c[5][j] >= 75 ? '#FFFFFF' : (c[5][j] === 0 ? '#4E4A3F' : '#B3AC9C') })),
        spinning: isSpinning,
        settled: !isSpinning,
        looping: phase[i] === 0,
        braking: phase[i] === 1,
        line: '#F2A23C',
        reel: strip,
        stopStrip: strip.slice(0, 6).concat([{ grade: c[4], name: c[0], gc: '#F2A23C', nc: '#F2ECDD' }]).concat(strip.slice(6, 9)),
        reelSpeed: (260 + i * 30) + 'ms',
        reelDelay: (-i * 90) + 'ms',
        bg: sel ? '#33261A' : '#1F1C17',
        edge: sel ? accent : '#3D3830',
        opacity: dimmed ? '0.45' : '1',
        dot: sel ? '✓' : '',
        dotBg: sel ? '#F2ECDD' : 'transparent',
        dotEdge: sel ? '#F2ECDD' : '#4A453C',
        pick: () => this.setState({ picked: picked === i ? null : i })
      }, this.gradeStyle(c[4]));
    });

    const progress = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({
      color: i < 5 ? '#F2ECDD' : (i === 5 ? accent : '#2C2822')
    }));

    const indiaCount = picked === null ? 3 : 4;

    return {
      accent: accent,
      cards: cards,
      progress: progress,
      reroll: () => {
        if (rerolls <= 0 || rolling) return;
        this.setState({ rerolls: rerolls - 1 });
        this.roll();
      },
      rerollLabel: rerolls > 0 ? 'Reroll · ' + rerolls : 'No rerolls',
      rerollEdge: rerolls > 0 ? '#4A453C' : '#2C2822',
      rerollColor: rerolls > 0 ? '#F2ECDD' : '#5C5749',
      chips: [
        { k: 'ELITE', v: '1 / 3', color: '#F2ECDD', edge: '#3D3830' },
        { k: 'TAKEN', v: (picked === null ? 5 : 6) + ' / 8', color: '#C4BDAC', edge: '#3D3830' },
        { k: 'INDIA', v: indiaCount + ' / 4', color: indiaCount >= 4 ? '#F2A23C' : '#C4BDAC', edge: indiaCount >= 4 ? '#6B3E12' : '#3D3830' }
      ],
      ctaLabel: rolling ? 'Rolling…' : (picked === null ? 'Take one to go on' : 'Next row'),
      ctaBg: picked === null || rolling ? '#2C2822' : '#F2ECDD',
      ctaEdge: picked === null || rolling ? '#4A453C' : '#F2ECDD',
      ctaText: picked === null || rolling ? '#9A9384' : '#100F0C'
    };
  }
}
</script>
</body>
</html>
