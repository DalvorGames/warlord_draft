<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; background: #100F0C; }
    button { font-family: inherit; cursor: pointer; }
    a { color: #E08A5F; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #100F0C; color: #F2ECDD; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 6px; height: 52px; flex-shrink: 0;">
    <a href="Phone-Deploy.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #B3AC9C; font-size: 20px; text-decoration: none;">&larr;</a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #B3AC9C;">4 &middot; THE MATCH REPORT</span>
    <a href="Phone-Result.dc.html" style="min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6F6858; font-size: 13px; text-decoration: none; padding: 0 8px;">Skip</a>
  </header>

  <div style="margin: 0 18px 10px 18px; flex-shrink: 0; background: #1F1C17; border: 1px solid #3D3830; border-radius: 4px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
    <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #F2A23C;">ASHOKA &middot; INDIA</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1; color: #F2A23C;">0.55</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #6F6858;">MORALE</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #D9724F; border: 1px solid #6E3620; border-radius: 2px; padding: 2px 6px;">ROUT AT 0.80</span>
    </div>
    <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 2px; align-items: flex-end;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #4FC0E6;">CHABRIAS &middot; GREECE</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; line-height: 1; color: #D9724F;">0.93</span>
    </div>
  </div>

  <div style="margin: 0 18px 10px 18px; flex-shrink: 0; display: flex; background: #16140F; border: 1px solid #2C2822; border-radius: 3px; padding: 3px;">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
      <button type="button" onClick="{{m.pick}}" style="flex-grow: 1; flex-basis: 0; background: {{m.bg}}; border: none; color: {{m.color}}; font-size: 13px; font-weight: 500; padding: 10px; border-radius: 2px; min-height: 40px;">{{m.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; align-items: baseline; padding: 0 18px 6px 18px; flex-shrink: 0;">
    <span style="width: 54px; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.12em; color: #5C5749;">BEAT</span>
    <span style="flex-grow: 1; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.12em; color: #5C5749;">{{listHint}}</span>
    <span style="width: 34px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: #F2A23C;">ASH</span>
    <span style="width: 34px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: #4FC0E6;">CHA</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px; padding: 0 18px; min-height: 0; overflow: hidden;">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
      <div style="display: flex; gap: 0; align-items: stretch;">
        <div style="width: 54px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-top: 10px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{c.gutterColor}};">{{c.gutter}}</span>
          <div style="width: 1px; flex-grow: 1; background: #2A2720; margin-left: 4px;"></div>
        </div>
        <div style="flex-grow: 1; min-width: 0; background: {{c.bg}}; border: 1px solid {{c.edge}}; border-left: 3px solid {{c.mark}}; border-radius: 3px; padding: 9px 10px 9px 11px; display: flex; gap: 8px;">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
            <sc-if value="{{c.hasTag}}" hint-placeholder-val="{{true}}">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: {{c.tagColor}};">{{c.tag}}</span>
            </sc-if>
            <span style="font-size: {{c.textSize}}; line-height: 1.38; color: {{c.textColor}}; font-family: {{c.textFont}};">{{c.text}}</span>
            <sc-if value="{{c.hasBars}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 2px;">
                <sc-for list="{{c.bars}}" as="b" hint-placeholder-count="3">
                  <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; width: 12px; color: #6F6858;">{{b.k}}</span>
                    <div style="flex-grow: 1; display: flex; height: 6px; background: #2C2822; border-radius: 1px; position: relative;">
                      <div style="flex-grow: 1; flex-basis: 0; display: flex; justify-content: flex-end;"><div style="height: 6px; width: {{b.aPct}}; background: #F2A23C; border-radius: 1px 0 0 1px;"></div></div>
                      <div style="flex-grow: 1; flex-basis: 0; display: flex;"><div style="height: 6px; width: {{b.bPct}}; background: #4FC0E6; border-radius: 0 1px 1px 0;"></div></div>
                      <div style="position: absolute; left: 50%; top: -2px; width: 1px; height: 10px; background: #5C5749;"></div>
                    </div>
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; width: 40px; text-align: right; color: {{b.tagColor}};">{{b.tag}}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <div style="flex-shrink: 0; display: flex; gap: 0; align-items: flex-start; padding-top: 1px;">
            <span style="width: 34px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{c.aColor}};">{{c.a}}</span>
            <span style="width: 34px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{c.bColor}};">{{c.b}}</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; border-top: 1px solid #2C2822; background: #16140F; padding: 12px 18px 28px 18px; display: flex; gap: 9px;">
    <a href="Phone-Battle.dc.html" style="flex-grow: 1; text-align: center; text-decoration: none; background: none; border: 1px solid #4A453C; color: #F2ECDD; font-size: 14px; padding: 14px; border-radius: 3px; min-height: 44px; box-sizing: border-box;">Watch it beat by beat</a>
    <a href="Phone-Result.dc.html" style="flex-grow: 1; text-align: center; text-decoration: none; background: #F2ECDD; color: #100F0C; font-size: 14px; font-weight: 600; padding: 14px; border-radius: 3px; min-height: 44px; box-sizing: border-box;">The reckoning</a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D9633C","options":["#C4562E","#F2ECDD","#7D8C5C","#8A6FA8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D9633C';
    const st = this.state || {};
    const mode = st.mode || 'key';
    const mine = '#F2A23C', theirs = '#4FC0E6';

    const bar = (k, a, b) => {
      const max = Math.max(a, b, 1);
      const edge = max > 0 ? Math.abs(a - b) / max : 0;
      return {
        k: k, aPct: (a / max * 100).toFixed(0) + '%', bPct: (b / max * 100).toFixed(0) + '%',
        tag: edge === 0 ? 'HELD' : (a > b ? '+' : '−') + Math.round(edge * 100) + '%',
        tagColor: edge === 0 ? '#6F6858' : (a > b ? mine : theirs)
      };
    };

    const plain = (gutter, text, a, b, bars) => ({
      gutter: gutter, gutterColor: '#9A9384', tag: '', hasTag: false, tagColor: '#9A9384',
      text: text, textSize: '13px', textColor: '#C4BDAC', textFont: "'IBM Plex Sans', sans-serif",
      bg: '#1F1C17', edge: '#3D3830', mark: '#3D3830',
      a: a.toFixed(2), b: b.toFixed(2), aColor: '#B3AC9C', bColor: '#B3AC9C',
      bars: bars || [], hasBars: !!(bars && bars.length)
    });
    const key = (gutter, tag, text, a, b, bars, hot) => Object.assign(plain(gutter, text, a, b, bars), {
      gutterColor: '#F2ECDD', tag: tag, hasTag: true, tagColor: hot === 'A' ? mine : '#D9724F',
      textSize: '15px', textColor: '#F2ECDD', textFont: "'Instrument Serif', Georgia, serif",
      bg: hot === 'A' ? '#2E2214' : '#2A1C15', edge: hot === 'A' ? '#6B3E12' : '#6E3620', mark: hot === 'A' ? mine : '#D9724F',
      aColor: a >= 0.8 ? '#D9724F' : '#F2ECDD', bColor: b >= 0.8 ? '#D9724F' : '#F2ECDD'
    });

    const every = [
      plain('SKIRM', 'Your longbows open on both his wings and find nothing shooting back. His crossbows pour it into your centre.', 0.30, 0.22, [bar('L', 54.1, 0), bar('C', 0, 65.5), bar('R', 51.1, 0)]),
      plain('CONTACT', 'The lines meet. You win all three clashes, none by enough to shake him.', 0.33, 0.32, [bar('L', 140.0, 114.8), bar('C', 328.4, 305.0), bar('R', 130.2, 112.0)]),
      plain('PRESS 1', 'Six against four in the centre starts to tell. Your wings pull ahead, slowly.', 0.41, 0.38, [bar('L', 153.1, 91.2), bar('C', 544.5, 718.4), bar('R', 121.4, 107.5)]),
      plain('PRESS 2', 'The centres trade blow for blow and come out level. His left is close to done.', 0.43, 0.42, [bar('L', 121.1, 113.3), bar('C', 572.4, 570.5), bar('R', 142.1, 76.8)]),
      key('PRESS 3', 'BOTH HIS WINGS BREAK', 'Gallic and Kshatriya horse leave the field. Both your wings are free; your centre holds at four fifths.', 0.51, 0.65, [bar('L', 136.1, 100.2), bar('C', 523.9, 689.6), bar('R', 167.1, 91.1)], 'A'),
      key('PRESS 4', 'ROLL-UP · CHABRIAS ROUTS', 'Two free wings wheel inward. Your right is held but marks his centre flanked; your left lands, and the centre folds.', 0.55, 0.93, [bar('L→C', 137.4, 125.6), bar('R→C', 97.5, 142.1), bar('C', 1328.0, 498.2)], 'A')
    ];

    const keyList = [
      plain('SKIRM', 'Longbows win both wings; his crossbows win the centre.', 0.30, 0.22, null),
      plain('CONTACT', 'You win all three clashes. Nobody is shaken.', 0.33, 0.32, null),
      plain('P1 – 2', 'Two grinding rounds. His centre presses, your wings wear his horse down.', 0.43, 0.42, null),
      every[4],
      every[5]
    ];

    const cards = mode === 'key' ? keyList : every;

    return {
      accent: accent,
      modes: [
        { label: 'Key beats', bg: mode === 'key' ? '#2A2419' : 'transparent', color: mode === 'key' ? '#F2ECDD' : '#9A9384', pick: () => this.setState({ mode: 'key' }) },
        { label: 'Every beat', bg: mode === 'every' ? '#2A2419' : 'transparent', color: mode === 'every' ? '#F2ECDD' : '#9A9384', pick: () => this.setState({ mode: 'every' }) }
      ],
      listHint: mode === 'key' ? 'WHAT DECIDED IT' : 'ALL THREE FRONTS, EVERY ROUND',
      cards: cards
    };
  }
}
</script>
</body>
</html>
