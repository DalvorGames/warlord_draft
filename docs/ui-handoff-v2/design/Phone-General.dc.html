<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; background: #100F0C; }
    button { font-family: inherit; cursor: pointer; }
    a { color: #E08A5F; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #100F0C; color: #F2ECDD; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 6px; height: 52px; flex-shrink: 0;">
    <a href="Phone-Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #B3AC9C; font-size: 20px; text-decoration: none;">&larr;</a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #B3AC9C;">1 &middot; YOUR GENERAL</span>
    <a href="Phone-Glossary.dc.html" aria-label="What do the numbers mean?" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none;"><span style="width: 22px; height: 22px; border-radius: 50%; border: 1px solid #4A453C; color: #B3AC9C; font-family: 'IBM Plex Mono', monospace; font-size: 12px; display: flex; align-items: center; justify-content: center;">?</span></a>
  </header>

  <div style="display: flex; gap: 4px; padding: 0 18px 14px 18px; flex-shrink: 0;">
    <div style="flex-grow: 1; height: 3px; background: #D9633C; border-radius: 1px;"></div>
    <div style="flex-grow: 1; height: 3px; background: #2C2822; border-radius: 1px;"></div>
    <div style="flex-grow: 1; height: 3px; background: #2C2822; border-radius: 1px;"></div>
    <div style="flex-grow: 1; height: 3px; background: #2C2822; border-radius: 1px;"></div>
  </div>

  <div style="padding: 0 18px 12px 18px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; font-weight: 400; line-height: 1.1;">{{title}}</h1>
      <span style="font-size: 12px; color: #9A9384;">{{sub}}</span>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6F6858; text-align: right; line-height: 1.5;">DRAWN FROM<br>81 GENERALS</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 18px; min-height: 0; overflow: hidden;">
    <sc-for list="{{cards}}" as="g" hint-placeholder-count="3">
      <div style="flex-grow: 1; flex-basis: 0; min-height: 0; perspective: 1200px;">
        <button type="button" onClick="{{g.tap}}" style="position: relative; width: 100%; height: 100%; background: none; border: none; padding: 0; text-align: left; transform-style: preserve-3d; transition: transform 560ms cubic-bezier(0.2, 0.7, 0.2, 1); transform: {{g.rot}};">

          <div style="position: absolute; inset: 0; backface-visibility: hidden; background: #1F1C17; border: 1px solid #3D3830; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
            <div style="position: absolute; inset: 7px; border: 1px solid #2C2822; border-radius: 5px;"></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.24em; color: #6F6858;">{{g.ordinal}}</span>
              <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; color: #9A9384;">Warlord Draft</span>
            </div>
          </div>

          <div style="position: absolute; inset: 0; backface-visibility: hidden; transform: rotateY(180deg); background: {{g.deep}}; border: 2px solid {{g.edge}}; border-radius: 8px; padding: 13px 15px; display: flex; flex-direction: column; gap: 7px; box-sizing: border-box; box-shadow: {{g.glow}};">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
              <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.18em; color: {{g.bright}};">{{g.culture}}</span>
                <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 27px; line-height: 1.05; color: #F2ECDD;">{{g.name}}</span>
              </div>
              <div style="flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1px solid {{g.dotEdge}}; background: {{g.dotBg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #100F0C;">{{g.dot}}</div>
            </div>
            <span style="font-size: 11px; font-style: italic; color: #E6DECB; opacity: 0.85; line-height: 1.35;">{{g.note}}</span>
            <div style="display: flex; gap: 10px; padding-top: 2px;">
              <sc-for list="{{g.stats}}" as="s" hint-placeholder-count="4">
                <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 3px;">
                  <div style="display: flex; justify-content: space-between; align-items: baseline;">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 0.08em; color: #E6DECB; opacity: 0.7;">{{s.k}}</span>
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: {{s.color}};">{{s.v}}</span>
                  </div>
                  <div style="height: 3px; background: rgba(0, 0, 0, 0.35); border-radius: 1px;"><div style="height: 3px; width: {{s.pct}}; background: {{s.color}}; border-radius: 1px;"></div></div>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              <sc-for list="{{g.chips}}" as="c" hint-placeholder-count="3">
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.08em; color: {{c.color}}; background: {{c.bg}}; border: 1px solid {{c.edge}}; border-radius: 2px; padding: 3px 7px;">{{c.text}}</span>
              </sc-for>
            </div>
          </div>

        </button>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; border-top: 1px solid #2C2822; background: #16140F; padding: 12px 18px 28px 18px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
    <div style="font-size: 12px; color: {{hintColor}}; line-height: 1.4; min-height: 17px;">{{hint}}</div>
    <a href="Phone-Draft.dc.html" style="display: block; text-align: center; text-decoration: none; background: {{ctaBg}}; border: 1px solid {{ctaEdge}}; color: {{ctaText}}; font-size: 16px; font-weight: 600; padding: 15px; border-radius: 3px; min-height: 44px; box-sizing: border-box;">{{ctaLabel}}</a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  componentDidMount() {
    this.timers = [0, 1, 2].map((i) => setTimeout(() => {
      this.setState((st) => {
        const f = ((st && st.flipped) || [false, false, false]).slice();
        f[i] = true;
        return { flipped: f };
      });
    }, 450 + i * 650));
  }

  componentWillUnmount() {
    (this.timers || []).forEach((t) => clearTimeout(t));
  }

  renderVals() {
    const st = this.state || {};
    const flipped = st.flipped || [false, false, false];
    const chosen = st.chosen === undefined ? null : st.chosen;

    const data = [
      { culture: 'GAULS & CELTS', deep: '#5C2245', bright: '#DA7AB0', name: 'Viridomarus', note: 'Insubres; killed by Marcellus at Clastidium 222',
        stats: [['COMMAND', 65], ['TACTICS', 60], ['SUPPLY', 50], ['CHARISMA', 80]],
        chips: [['AGGRESSIVE', false], ['2 ELITE', false], ['FUROR', false]],
        hint: 'Charisma 80 steadies every front. Logistics 50 keeps you at two elites.' },
      { culture: 'INDIA (NANDA / MAURYA)', deep: '#6B3E12', bright: '#F2A23C', name: 'Ashoka', note: 'Kalinga 261 — before the remorse',
        stats: [['COMMAND', 70], ['TACTICS', 65], ['SUPPLY', 90], ['CHARISMA', 75]],
        chips: [['DEFENSIVE', false], ['3 ELITE', true], ['ELEPHANT LINE', false]],
        hint: 'Logistics 90 buys a third elite slot. The only one of the three who gets one.' },
      { culture: 'CARTHAGE', deep: '#4A2A6B', bright: '#B58AE0', name: 'Hasdrubal Barca', note: 'Spain; Metaurus 207',
        stats: [['COMMAND', 70], ['TACTICS', 65], ['SUPPLY', 75], ['CHARISMA', 65]],
        chips: [['AGGRESSIVE', false], ['2 ELITE', false], ['MERCENARY ARMY', false]],
        hint: 'Nothing spikes. Mercenary Army lifts every unit that is not Carthaginian.' }
    ];

    const allUp = flipped.every((f) => f);
    const cards = data.map((g, i) => {
      const sel = chosen === i;
      return {
        ordinal: ['THE FIRST', 'THE SECOND', 'THE THIRD'][i],
        rot: flipped[i] ? 'rotateY(180deg)' : 'rotateY(0deg)',
        culture: g.culture, deep: g.deep, bright: g.bright, name: g.name, note: g.note,
        stats: g.stats.map((s) => ({ k: s[0], v: s[1], pct: s[1] + '%', color: s[1] >= 85 ? '#FFFFFF' : '#E6DECB' })),
        chips: g.chips.map((c) => ({ text: c[0], color: c[1] ? '#100F0C' : g.bright, bg: c[1] ? '#F2ECDD' : 'transparent', edge: c[1] ? '#F2ECDD' : g.bright })),
        edge: sel ? '#F2ECDD' : g.bright,
        glow: sel ? '0 0 26px rgba(242, 236, 221, 0.22)' : 'none',
        dot: sel ? '✓' : '', dotBg: sel ? '#F2ECDD' : 'transparent', dotEdge: sel ? '#F2ECDD' : g.bright,
        tap: () => { if (!flipped[i]) return; this.setState({ chosen: chosen === i ? null : i }); }
      };
    });

    return {
      cards: cards,
      title: allUp ? 'Three names. Take one.' : 'Three came up.',
      sub: allUp ? 'Tap a card to take him. Tap ? for what the numbers mean.' : 'Turning them over…',
      hint: chosen !== null ? data[chosen].hint : (allUp ? 'Tap the one you want.' : ''),
      hintColor: chosen !== null ? '#F2ECDD' : '#6F6858',
      ctaLabel: chosen !== null ? 'Take the field with ' + data[chosen].name.split(' ')[0] : 'Pick a general',
      ctaBg: chosen !== null ? '#F2ECDD' : '#2C2822',
      ctaEdge: chosen !== null ? '#F2ECDD' : '#3D3830',
      ctaText: chosen !== null ? '#100F0C' : '#9A9384'
    };
  }
}
</script>
</body>
</html>
